name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python tools/validate_research_governance.py
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m flyts synthetic --output data/ci
      - run: python -m flyts pretrain --manifest data/ci/manifest.json --config configs/smoke.json --output outputs/ci --device cpu
