name: tests

on:
  push:
  pull_request:

jobs:
  stage14-static-only:
    if: github.ref_name == 'codex/stage-13-narrow-preflight-proposal' || github.head_ref == 'codex/stage-13-narrow-preflight-proposal' || github.ref_name == 'codex/stage13-formal-recovery-gate' || github.head_ref == 'codex/stage13-formal-recovery-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/validate_research_governance.py
      - run: python -c "import ast, pathlib; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8'), filename=p) for p in ('tools/stage14_preflight.py', 'tools/stage14_preflight_cases.py', 'tools/stage14_offline/sitecustomize.py')]"
  pytest:
    # Gated research branches cannot run the default model smoke before PI approval.
    if: github.ref_name != 'codex/stage-13-narrow-preflight-proposal' && github.head_ref != 'codex/stage-13-narrow-preflight-proposal' && github.ref_name != 'codex/stage13-formal-recovery-gate' && github.head_ref != 'codex/stage13-formal-recovery-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python tools/validate_research_governance.py
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m flyts synthetic --output data/ci
      - run: python -m flyts pretrain --manifest data/ci/manifest.json --config configs/smoke.json --output outputs/ci --device cpu
